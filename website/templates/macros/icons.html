{% macro icon(name, label="") -%}
<svg class="ui-icon" aria-hidden="{{ 'true' if not label else 'false' }}"{% if label %} role="img" aria-label="{{ label }}"{% endif %} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  {% if name == "route" %}
  <circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M6 7.5v2a3 3 0 0 0 3 3h3a3 3 0 0 1 3 3v1"/><path d="m15 16.5 2 2 2-2"/>
  {% elif name == "map" %}
  <path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/>
  {% elif name == "calendar" %}
  <rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/>
  {% elif name == "info" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.5h.01"/>
  {% elif name == "arrow" %}
  <path d="M5 12h13M13 6l6 6-6 6"/>
  {% elif name == "bus" %}
  <rect x="5" y="3" width="14" height="17" rx="3"/><path d="M5 13h14M8 17h.01M16 17h.01M7 7h10"/>
  {% elif name == "pin" %}
  <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
  {% endif %}
</svg>
{%- endmacro %}
